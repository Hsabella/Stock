# 复制为 watchlist.yaml 后填写自己的配置。版本库只维护本模板。
cooldown_days: 10
default_stop_strategy: "atr_2"
default_max_position_pct: 0.10
hard_stop_pct: 0.08

account:
  cash: 0
  as_of: null
  etf: []
  # 核心 ETF 每行填写 symbol、name、position 和 entry_price。

target_structure:
  core_etf_pct: [0.40, 0.50]
  satellite_max_count: 3
  satellite_max_pct: 0.10

watchlist: []
# 在 watchlist 下按需添加条目。symbol 用引号保留前导零。
# WATCHING 或 NONE 填写 symbol、name 和 state。
# HELD 另填 position、entry_price、entry_date 和 entry_arm。
# entry_arm 可为 left（抄底灯建仓）或 right（右侧入场）。
# EXITED 另填 exit_date 和 exit_price 以进入回补观察。
