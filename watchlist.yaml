# 自选股 / 候选股池（决策引擎输入）
# state: NONE / WATCHING / HELD / EXITED
# 实盘配置 — 2026-05-10
cooldown_days: 10
default_stop_strategy: "atr_2"   # 棘轮 k=2: 止损 = max(初始止损, 入场以来最高收盘-2×ATR14 的历史最大, 只升不降)
                                 #   ATR趋势线(回补观察/ETF观察的趋势读数)仍为 近20日最高收盘-2×ATR14, 与止损锚点已分离
default_max_position_pct: 0.10

